behavior:
  a11y:
    - Every control MUST have a programmatically associated <label> (for/id or wrapping).
    - Link help text via aria-describedby so it is announced after the label.
    - Reflect invalid state with aria-invalid="true|false" on the control.
    - Render validation errors with role="alert" aria-live="assertive" so they announce immediately.
    - Label the date input; the calendar popup is a dialog containing a grid (role="grid") of day cells.
    - Provide accessible names for the previous/next month navigation and announce the selected date(s).
  keyboard:
    - All interactive affordances are real, focusable elements in DOM order.
    - Arrow keys move between days, PageUp/PageDown change month, Enter selects, Esc closes.
  validation:
    - Range selection, blackout dates, and min/max beyond a single value are scripted; native <input type="date"> only supports min/max on one date.
gaps:
  - id: accessibility
    feature: Accessibility
    guidance: Native date inputs vary widely across browsers and platforms, with inconsistent screen reader announcements, keyboard behavior, and focus management.
  - id: date-range-selection
    feature: Date range selection
    guidance: HTML has no native concept of a date range picker.
  - id: blackout-dates
    feature: Blackout dates
    guidance: Native date inputs have no mechanism to mark specific dates as unavailable.
  - id: custom-validation
    feature: Custom validation
    guidance: Native date validation is limited to required, min, and max, and error messages are browser-controlled.
  - id: responsive-layout
    feature: Responsive layout
    guidance: Native date inputs render a small, browser-controlled popup that cannot be styled or repositioned.
  - id: localization
    feature: Localization
    guidance: Native <input type="date"> follows the browser's locale for display format but offers no control over month names, navigation labels, or ARIA text.
  - id: custom-cell-content
    feature: Custom cell content
    guidance: Native date inputs render a fixed grid of numbers, with no way to add prices, icons, or supplementary information to individual dates.
  - id: design-system-integration
    feature: Design system integration
    guidance: A native <input type="date"> cannot be styled to match a design system — shadow DOM browser controls resist CSS customization and the calendar popup is entirely outside author control.
