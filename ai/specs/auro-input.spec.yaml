behavior:
  a11y:
    - Every control MUST have a programmatically associated <label> (for/id or wrapping).
    - Link help text via aria-describedby so it is announced after the label.
    - Reflect invalid state with aria-invalid="true|false" on the control.
    - Render validation errors with role="alert" aria-live="assertive" so they announce immediately.
    - When the field is not `required`, append "(optional)" to the accessible label.
    - For password fields, the show/hide toggle needs its own accessible name (aria-label).
  keyboard:
    - All interactive affordances are real, focusable elements in DOM order.
  validation:
    - Track a "touched" state; do NOT show errors before the field is first blurred.
    - On invalid, swap the helpText content for the error message and set aria-invalid="true".
gaps:
  - id: input-masking
    feature: Input masking
    guidance: 'auro-input integrates IMask to apply format patterns as the user types — for example format="(###) ###-####" for phone numbers or format="mm/dd/yyyy" for dates.'
  - id: credit-card-formatting-and-detection
    feature: Credit-card formatting and detection
    guidance: auro-input with type="credit-card" auto-detects Visa, Mastercard, American Express, Discover, Diners Club, and Alaska Airlines cards from the first digits, applies the correct digit grouping (e.g., 4-4-4-4 for Visa, 4-6-5 for Amex), displays the matching card brand icon, and validates with the Luhn algorithm.
  - id: password-show-hide-toggle
    feature: Password show/hide toggle
    guidance: auro-input with type="password" includes an accessible show/hide toggle with customizable ARIA labels via the ariaLabel.password.show and ariaLabel.password.hide slots.
  - id: clear-button
    feature: Clear button
    guidance: auro-input renders an accessible clear button when the field has a value, with a customizable ARIA label via the ariaLabel.clear slot.
  - id: custom-validation-messages
    feature: Custom validation messages
    guidance: auro-input exposes a full set of per-constraint setters — setCustomValidityValueMissing, setCustomValidityRangeOverflow, setCustomValidityRangeUnderflow, setCustomValidityTooLong, setCustomValidityTooShort, setCustomValidityBadInput, setCustomValidityCustomError, and setCustomValidityForType.
  - id: format-types
    feature: Format types
    guidance: auro-input ships dedicated type values for credit-card, month-day-year, year-month-day, day-month-year, month-year, month-fullYear, and year-month, each applying the correct mask, validation, and accent icon.
  - id: floating-and-dynamic-labels
    feature: Floating and dynamic labels
    guidance: auro-input floats the label above the field when it is focused or populated, and automatically associates slotted label content with the underlying input.
  - id: display-value-slot
    feature: Display value slot
    guidance: auro-input supports a displayValue slot that renders custom HTML in place of the raw value when the input is blurred — useful for masked account numbers or formatted currency.
  - id: layout-and-shape-variants
    feature: Layout and shape variants
    guidance: auro-input supports classic, emphasized, and snowflake layouts, as well as shape variants (box, pill, pill-left, pill-right).
  - id: icon-slots-and-accents
    feature: Icon slots and accents
    guidance: auro-input renders left and right accent slots and an automatic accent icon for typed formats (credit-card brand icon, calendar icon for date types).
  - id: help-text-and-error-slots
    feature: Help text and error slots
    guidance: auro-input exposes a helpText slot that automatically swaps to the validation error message when the field is invalid, with the correct ARIA wiring and color treatment.
  - id: validation-timing-control
    feature: Validation timing control
    guidance: auro-input supports validateOnInput to validate on every keystroke, noValidate to disable validation, and tracks touched state so errors do not appear before the user has interacted with the field.
  - id: form-integration-events
    feature: Form integration events
    guidance: auro-input dispatches auroFormElement-validated events so a parent auro-form can coordinate validation across all child fields.
  - id: multi-brand-theming
    feature: Multi-brand theming
    guidance: auro-input consumes Auro design tokens through its component logic, so it automatically picks up brand-specific theming when token packages are swapped.
