behavior:
  a11y:
    - Every control MUST have a programmatically associated <label> (for/id or wrapping).
    - Link help text via aria-describedby so it is announced after the label.
    - Reflect invalid state with aria-invalid="true|false" on the control.
    - Render validation errors with role="alert" aria-live="assertive" so they announce immediately.
    - The input has role="combobox", aria-expanded, aria-controls pointing to the listbox id, and aria-activedescendant pointing to the highlighted option.
    - The listbox uses role="listbox" with role="option" children and aria-selected on the chosen option.
  keyboard:
    - All interactive affordances are real, focusable elements in DOM order.
    - Down opens/enters the list; Up/Down move the active option; Enter selects; Esc closes.
  validation:
    - Enforce "must select a listed option" in script; native <datalist> does not restrict input to its options.
gaps:
  - id: filter-vs-suggestion-behavior
    feature: Filter vs. suggestion behavior
    guidance: auro-combobox exposes a behavior attribute ("filter" or "suggestion") that controls whether the user must select a menu option or may submit a freeform typed value.
  - id: custom-filtering-and-matching
    feature: Custom filtering and matching
    guidance: auro-combobox filters options against the typed value and supports a suggest attribute on each menu option for additional matching keywords, plus persistent, static, and nomatch options that change how the list reacts to input.
  - id: highlighted-match-text
    feature: Highlighted match text
    guidance: auro-combobox passes the typed value to auro-menu as a matchWord so the matching substring is visually highlighted in each option.
  - id: custom-validation-messages
    feature: Custom validation messages
    guidance: auro-combobox exposes setCustomValidity, setCustomValidityCustomError, setCustomValidityValueMissing, and setCustomValidityValueMissingFilter for fully customizable error messages per validity state, including a distinct message for "did not pick a value from the list" when behavior="filter".
  - id: touched-state-tracking
    feature: Touched-state tracking
    guidance: auro-combobox tracks a touched state so validation errors only appear after the user has interacted with the field.
  - id: keyboard-navigation-and-aria
    feature: Keyboard navigation and ARIA
    guidance: 'auro-combobox implements the WAI-ARIA combobox pattern: role="combobox" on the input, aria-expanded, aria-controls, aria-activedescendant, and aria-setsize/aria-posinset on each option, plus arrow-key navigation, Home/End, Escape to close, and Enter to select.'
  - id: screen-reader-announcements
    feature: Screen reader announcements
    guidance: auro-combobox dispatches live-region announcements when an option becomes active ("Seattle, not selected, 1 of 5") and when an option is selected, including special handling for fullscreen dialog mode where the trigger is inert.
  - id: mobile-fullscreen-presentation
    feature: Mobile fullscreen presentation
    guidance: auro-combobox automatically switches to a fullscreen dialog at a configurable fullscreenBreakpoint for mobile-friendly input, including iOS virtual keyboard retention logic so the keyboard stays visible across the trigger-to-dialog transition.
  - id: rich-option-content-and-display-value
    feature: Rich option content and display value
    guidance: auro-combobox works with auro-menuoption elements that can contain markup, icons, and a displayValue slot that lets the visible trigger content differ from the underlying value (paired with persistInput for advanced filter UIs).
  - id: coordinated-value-and-option-selected-state
    feature: Coordinated value and option-selected state
    guidance: auro-combobox exposes both value (the selected option's value) and optionSelected (a reference to the chosen auro-menuoption element), and fires input and inputValue events with structured detail.
  - id: form-integration-events
    feature: Form integration events
    guidance: auro-combobox dispatches auroFormElement-validated events so parent auro-form elements can coordinate validation across all child fields.
  - id: reset-behavior
    feature: Reset behavior
    guidance: auro-combobox provides reset() and clear() methods that clear the input, menu selection, validation state, and touched flag in one call.
  - id: layouts-shapes-and-sizes
    feature: Layouts, shapes, and sizes
    guidance: auro-combobox supports layout (classic, emphasized, snowflake), shape, and size attributes that coordinate the appearance of the trigger, dropdown, and menu options together.
  - id: multi-brand-theming
    feature: Multi-brand theming
    guidance: auro-combobox consumes Auro design tokens through its component logic, so it automatically picks up brand-specific theming when token packages are swapped.
examples:
  - id: basic-combobox
    html: |-
      <label class="combobox">
        <span class="combobox-label">Departure airport</span>
        <input
          type="text"
          class="combobox-input"
          name="departure"
          list="airport-options"
          autocomplete="off" />
        <datalist id="airport-options">
          <option value="Seattle (SEA)"></option>
          <option value="Portland (PDX)"></option>
          <option value="San Francisco (SFO)"></option>
          <option value="Los Angeles (LAX)"></option>
        </datalist>
      </label>
  - id: required-combobox-in-a-form
    html: |-
      <form>
        <label class="combobox">
          <span class="combobox-label">Destination</span>
          <input
            type="text"
            class="combobox-input"
            name="destination"
            list="destination-options"
            required
            autocomplete="off" />
          <datalist id="destination-options">
            <option value="Anchorage (ANC)"></option>
            <option value="Fairbanks (FAI)"></option>
            <option value="Juneau (JNU)"></option>
          </datalist>
        </label>
        <button type="submit">Search</button>
      </form>
